<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les cartes du moment · Groupe Le Coq</title>
<meta name="description" content="Les cartes du moment des maisons du Groupe Le Coq : Bistrot des Girondins, Basta, La Casetta et les autres.">
<link rel="icon" href="assets/logos/lecoq-picto.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top scrolled" id="top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Groupe Le Coq, accueil"><img src="assets/logos/lecoq-noir.png" alt="Groupe Le Coq"></a>
    <nav class="nav" id="nav" aria-label="Navigation principale">
      <a href="index.html#maisons">Nos maisons</a>
      <a href="cartes.html" aria-current="page">Les cartes</a>
      <a href="galerie.html">Galerie</a>
      <a href="index.html#nouveautes">Nouveautés</a>
      <a href="index.html#evenements">Événements</a>
      <a href="index.html#recrutement">Recrutement</a>
      <a href="index.html#presse">Presse</a>
    </nav>
    <button class="burger" id="burger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="wrap" style="padding-block:56px 96px">
  <p class="label">Les cartes du moment</p>
  <h1 style="font-size:clamp(44px,7vw,96px);font-weight:500;margin:10px 0 32px">À table !</h1>
  <nav class="cartes-nav" id="cartes-nav" aria-label="Choisir une maison"></nav>
  <div id="cartes"></div>
</main>

<footer class="pied" style="padding-block:40px 28px">
  <div class="wrap"><div class="bas" style="margin:0;border:0;padding:0"><span>© Groupe Le Coq · <a href="index.html">Retour à l'accueil</a> · <a href="mentions-legales.html">Mentions légales</a></span><span>Prix nets en euros, service compris. Liste des allergènes disponible sur demande.</span></div></div>
</footer>

<script src="assets/contenu.js"></script>
<script src="assets/cartes.js"></script>
<script>
const CARTES = window.CARTES;
const D = window.LECOQ, $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const liste = D.maisons.map(m => ({...m, cle:m.carte||m.id})).concat(D.bientot.map(b=>({...b, cle:b.carte, ville:b.lieu, type:"Bientôt · "+b.quand, fond:"#F3E9D2"})));
$("#cartes-nav").innerHTML = liste.map(m => `<a href="#${m.cle}" data-k="${m.cle}">${esc(m.nom)}</a>`).join("");
$("#cartes").innerHTML = liste.map(m => { const c = CARTES[m.cle];
  const head = `<div class="entete">${m.logo?`<img class="lg" src="assets/logos/${m.logo}" alt="" style="background:${m.fond};padding:10px 14px">`:""}
      <p class="label">${esc(m.type)} · ${esc(m.ville)}</p><h2>${esc(m.nom)}</h2>
      ${c?`<p><b>${esc(c.titre)}.</b> ${esc(c.note)}</p>`:""}
      <p style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">${(m.resa||m.whatsapp||m.mailResa||m.tel)?`<button class="btn sm" type="button" data-resa="${m.id}">Réserver</button>`:""}${c&&c.pdf?`<a class="btn sm clair" href="${c.pdf}" target="_blank" rel="noopener">Carte en PDF</a>`:""}</p>
      ${m.adresse?`<p style="margin-top:14px;font-size:15px">${esc(m.adresse)}${m.tel?` · <a href="tel:${m.tel.replace(/\s/g,"")}">${esc(m.tel)}</a>`:""}</p>`:""}</div>`;
  let body;
  if (c && c.image) body = `<img class="carte-img" src="${c.image}" alt="Carte ${esc(m.nom)}" loading="lazy">`;
  else if (c && c.sections) body = `<div class="menu-html">${c.sections.map(([t,items]) => `<h3>${esc(t)}</h3>` + items.map(([n,d,p]) => `<div class="plat"><b>${esc(n)}</b>${p?`<span class="p">${esc(p)} €</span>`:""}${d?`<small>${esc(d)}</small>`:""}</div>`).join("")).join("")}</div>`;
  else { const h = m.instagram || D.reglages.instagramGroupe;
    body = `<div class="vide"><p style="font-family:var(--f-titre);font-size:24px;color:var(--encre)">La carte change au fil du marché.</p><p style="margin-top:8px">Retrouvez l'ardoise du moment sur Instagram ou demandez-la par téléphone.</p><p style="margin-top:18px"><a class="btn sm" href="https://www.instagram.com/${esc(h)}/" target="_blank" rel="noopener">@${esc(h)}</a></p></div>`; }
  return `<section class="carte-bloc" id="${m.cle}">${head}<div>${body}</div></section>`; }).join("");
function marque(){ const k = location.hash.slice(1); document.querySelectorAll("#cartes-nav a").forEach(a => a.setAttribute("aria-current", a.dataset.k===k)); }
addEventListener("hashchange", marque); marque();
const burger = $("#burger"), nav = $("#nav"); burger.onclick = () => { const o = nav.classList.toggle("open"); burger.setAttribute("aria-expanded", o); };
</script>
<dialog class="resa" id="resa" aria-labelledby="resa-titre">
  <header><h3 id="resa-titre">Réserver une table</h3><button class="fermer" type="button" data-close aria-label="Fermer">×</button></header>
  <div class="liste" id="resa-liste"></div>
</dialog>
<script src="assets/resa.js"></script>
</body>
</html>
